{% extends "base.html" %}{% block content %}<div class="page"><div class="head"><div><div class="ey">NOTIFICATIONS</div><h1 class="pt">Customer Notifications</h1><p class="desc">Portal activity requiring your attention.</p></div></div><div class="card pad">{% for n in notifications %}<div class="detail"><div><b>{{ n.title }}</b><div class="desc">{{ n.message }}</div></div><span class="desc">{{ n.created_at|date:"d M Y, h:i A" }}</span></div>{% empty %}<div class="empty">No notifications.</div>{% endfor %}</div></div>{% endblock %}
