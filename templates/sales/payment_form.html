{% extends "base.html" %}{% block content %}<div class="page"><div class="head"><div><div class="ey">PAYMENT</div><h1 class="pt">Add Payment — {{ order.order_no }}</h1></div></div><div class="card pad"><form method="post">{% csrf_token %}<div class="field"><label>Payment Type</label><select name="payment_type" class="w-full rounded-lg border border-slate-300 px-3 py-2.5">{% for value,label in payment_types %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div><div class="field"><label>Amount</label><input name="amount" type="number" step="0.01" min="0" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div><div class="field"><label>Reference</label><input name="reference" class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div><div class="field"><label>Paid On</label><input name="paid_on" type="date" class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div><div class="field"><label>Status</label><select name="status" class="w-full rounded-lg border border-slate-300 px-3 py-2.5">{% for value,label in payment_statuses %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div><div class="field"><label>Notes</label><textarea name="notes" class="w-full rounded-lg border border-slate-300 px-3 py-2.5" rows="4"></textarea></div><button class="btn primary">Save Payment</button></form></div></div>{% endblock %}
