{% extends "base.html" %}{% block content %}<div class="page"><div class="head"><div><div class="ey">DELIVERY / INSTALLATION</div><h1 class="pt">{{ order.order_no }}</h1></div></div><div class="card pad"><form method="post">{% csrf_token %}<div class="grid g2"><div class="field"><label>Delivery Date</label><input name="delivery_date" type="date" value="{{ delivery.delivery_date|date:'Y-m-d' }}" class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div><div class="field"><label>Status</label><select name="status" class="w-full rounded-lg border border-slate-300 px-3 py-2.5">{% for value,label in delivery_statuses %}<option value="{{ value }}" {% if delivery.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div></div><div class="field"><label>Address</label><textarea name="address" class="w-full rounded-lg border border-slate-300 px-3 py-2.5" rows="3">{{ delivery.address }}</textarea></div><div class="grid g2"><div class="field"><label>Transport</label><input name="transport" value="{{ delivery.transport }}" class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div><div class="field"><label>Responsible Person</label><input name="responsible_person" value="{{ delivery.responsible_person }}" class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div></div><label style="display:block;margin:12px 0"><input type="checkbox" name="installation_required" {% if delivery.installation_required %}checked{% endif %}> Installation required</label><div class="field"><label>Installation Date</label><input name="installation_date" type="date" value="{{ delivery.installation_date|date:'Y-m-d' }}" class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div><div class="field"><label>Acknowledgement</label><textarea name="acknowledgement" class="w-full rounded-lg border border-slate-300 px-3 py-2.5" rows="3">{{ delivery.acknowledgement }}</textarea></div><div class="field"><label>Completion Notes</label><textarea name="completion_notes" class="w-full rounded-lg border border-slate-300 px-3 py-2.5" rows="3">{{ delivery.completion_notes }}</textarea></div><button class="btn primary">Save Delivery</button></form></div></div>{% endblock %}
