name: SADACO CI

on:
  push:
    branches:
      - feature/phase-2-department-access
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sadaco
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sadaco"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: sadaco.settings
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: sadaco
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Apply committed database migrations
        run: python manage.py migrate --noinput
      - name: Verify migration plan
        run: python manage.py migrate --check
      - name: Run Django security and business regression tests
        run: >-
          python manage.py test --verbosity 2
          core.tests.SystemFoundationTests
          core.tests.DepartmentManagementTests
          core.tests.CustomerRequestDepartmentAccessTests
          core.tests.ApprovalDepartmentAccessTests
          sales.tests.SalesModelTests
          sales.tests.SalesValidationTests
          sales.tests.SalesDepartmentAccessTests
          sales.tests.SalesOrderLifecyclePermissionTests
          production.tests.ProductionDepartmentAccessTests
          quality.tests.QualityMutationPermissionTests
          quality.tests.QualityReworkLifecycleTests
          delivery.tests.DeliveryLifecycleTests
          purchase.tests.PurchaseDepartmentAccessTests
          finance.tests.FinanceDepartmentAccessTests
          finance.tests.FinancePositiveAmountValidationTests
          marketing.tests.MarketingDepartmentAccessTests
          reports.tests.ReportsDepartmentAccessTests
          staff.tests.DepartmentAccessScopeTests
          products.test_costing.MaterialCostingModelTests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build React frontend
        run: npm run build --prefix frontend
