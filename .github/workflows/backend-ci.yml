name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: write

jobs:
  django-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Generate and apply initial migrations
        run: |
          python manage.py makemigrations core
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
      - name: Run automated tests
        run: python manage.py test

      - name: Commit generated migration to PR branch
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          find backend -type d -name __pycache__ -prune -exec rm -rf {} +
          if [ -n "$(git status --porcelain backend/core/migrations)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/core/migrations
            git commit -m "chore: add generated Phase 1 initial migration"
            git push origin HEAD:${{ github.head_ref }}
          fi

  postgres-check:
    needs: django-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sadaco_ci
          POSTGRES_USER: sadaco_ci
          POSTGRES_PASSWORD: sadaco_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sadaco_ci -d sadaco_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://sadaco_ci:sadaco_ci@127.0.0.1:5432/sadaco_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Apply PostgreSQL migrations
        run: |
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
      - name: Run automated tests on PostgreSQL
        run: python manage.py test

