name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  django-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Apply SQLite migrations
        run: python manage.py migrate --noinput
      - name: Run automated tests on SQLite
        run: python manage.py test

  postgres-check:
    needs: django-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sadaco_ci
          POSTGRES_USER: sadaco_ci
          POSTGRES_PASSWORD: sadaco_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sadaco_ci -d sadaco_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://sadaco_ci:sadaco_ci@127.0.0.1:5432/sadaco_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Apply PostgreSQL migrations
        run: python manage.py migrate --noinput
      - name: Run automated tests on PostgreSQL
        run: python manage.py test
